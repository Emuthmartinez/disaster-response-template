name: Deploy admin (manual)

# Despliega SOLO el panel admin (Worker de admin/, vía @opennextjs/cloudflare).
#
# MANUAL A PROPÓSITO, igual que el backend: el panel es la superficie de
# escritura interna sobre datos reales. Que alguien tenga que pulsar el
# botón es la funcionalidad.
#
# El panel no lleva secretos de runtime propios: su BFF solo necesita saber
# dónde vive la API (ver admin/wrangler.jsonc -> vars.EMERGENCY_API_URL); la
# sesión es el JWT del backend en cookie httpOnly. Doppler aquí solo aporta
# los tokens de Cloudflare para wrangler.
#
# Lanzarlo:  Actions -> "Deploy admin (manual)" -> Run workflow
#       o:   gh workflow run deploy-admin.yml -f confirmar=desplegar
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe "desplegar" para confirmar'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Deploy del panel admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Segunda red de seguridad: sin la palabra exacta, ni se ejecuta.
    if: github.event.inputs.confirmar == 'desplegar'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Mismo motivo que en deploy-backend.yml: este workflow despliega
      # admin/ tal como está en el ref de este run, no "lo último de main".
      - name: "Advertencia: ref que se va a desplegar"
        run: |
          echo "::warning::Este run despliega admin/ tal como está en ${{ github.ref }} (commit ${{ github.sha }}) — NO necesariamente 'lo último de main'."
          echo "Ref desplegado: ${{ github.ref }}"
          echo "SHA desplegado: ${{ github.sha }}"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Instalar Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: admin
        run: npm ci

      - name: Typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Build (OpenNext -> Workers)
        working-directory: admin
        run: npx opennextjs-cloudflare build

      - name: Deploy a Cloudflare Workers
        working-directory: admin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run --command '
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            npx wrangler deploy --old-asset-ttl 86400'

      # Si Cloudflare Access (u otro Zero Trust) protege el panel completo,
      # este smoke check devolverá 302 a un login en vez de 200 aunque el
      # deploy haya salido perfecto — hace falta una app de bypass en Access
      # que cubra EXACTAMENTE /api/health (y nada más) para que este check
      # siga viendo 200 sin abrir el resto del panel. Sin esa app de bypass,
      # cambia este check por uno que valide el 302/redirect esperado, o
      # acepta que este paso solo puede confirmar "el Worker respondió algo".
      - name: Smoke check del panel
        run: |
          set -euo pipefail
          ADMIN_DOMAIN="$(jq -r '.domains.admin' config/deployment.config.json)"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://${ADMIN_DOMAIN}/api/health" || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::El panel no devolvió 200 tras el despliegue"
          exit 1
